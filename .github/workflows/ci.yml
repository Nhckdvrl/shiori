name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm package
      - run: pnpm test:tags
      - run: pnpm test:portability
      - run: pnpm check:release
      - run: pnpm package:installer
